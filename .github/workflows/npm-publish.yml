name: npm-publish

# Publishes @icaro0310/devin-bridge to npmjs.com.
# Requires repo secret NPM_TOKEN (granular access token, automation type).
# Triggers: publishing a GitHub Release, or manual Actions dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
