name: test-bridge

on:
  push:
    branches: [main]
    paths:
      - 'packages/bridge/**'
      - '.github/workflows/test-bridge.yml'
  pull_request:
    paths:
      - 'packages/bridge/**'
      - '.github/workflows/test-bridge.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        working-directory: packages/bridge
        run: node --test
