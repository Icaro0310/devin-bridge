name: ci
# Intentionally NOT a thin caller: Node.js toolchain, not Python — python-test.yml does not apply.
# See Icaro0310/devin-powerups .github/workflows/VARIANTS.md.


on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan for secret-looking strings
        run: |
          set -e
          PATTERNS='(ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|api[_-]?key["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_-]{16,})'
          if grep -rInE "$PATTERNS" --exclude-dir=.git --exclude-dir=fixtures --exclude-dir=node_modules .; then
            echo "::error::Secret-looking content found. Sanitize before merging."
            exit 1
          fi
          echo "No secret-looking content found."
