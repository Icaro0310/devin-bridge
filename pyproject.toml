[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-orchestrator"
version = "0.1.0"
description = "Background-worker fan-out policy for Devin Desktop — deterministic planner enforcing worker caps, no nesting, and collect-before-report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devin-orchestrator = "devin_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
